name: Urea Client V1.5.5 Build

on:
  push:
    branches:
      - chatgpt/app-v1.5.5-ci

permissions:
  contents: read
  actions: read

jobs:
  build-v155:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Download V1.5.4 build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/Tsengfan-zju/XTR_Beer/actions/artifacts/12156328917/zip"             -o /tmp/v154-artifact.zip
          mkdir -p /tmp/v154-artifact
          unzip -q /tmp/v154-artifact.zip -d /tmp/v154-artifact
          test -f /tmp/v154-artifact/UreaClientApp-source-v1.5.4.zip
          mkdir -p /tmp/appsrc
          unzip -q /tmp/v154-artifact/UreaClientApp-source-v1.5.4.zip -d /tmp/appsrc
          test -f /tmp/appsrc/UreaClientApp/app/build.gradle

      - name: Apply V1.5.5 patch
        run: |
          set -euxo pipefail
          python3 chatgpt-build/apply_v155.py /tmp/appsrc/UreaClientApp
          cd /tmp/appsrc/UreaClientApp
          grep -F 'versionCode 11' app/build.gradle
          grep -F "versionName '1.5.5'" app/build.gradle
          grep -F '智营管家' app/src/main/res/values/strings.xml
          grep -F 'device_business_snapshot_v1' app/src/main/java/com/urea/selfservice/client/DeviceSettingsActivity.java

      - name: Package source
        run: |
          cd /tmp/appsrc
          zip -qr /tmp/UreaClientApp-source-v1.5.5.zip UreaClientApp
          sha256sum /tmp/UreaClientApp-source-v1.5.5.zip

      - name: Build release
        working-directory: /tmp/appsrc/UreaClientApp
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Align and collect
        run: |
          set -euxo pipefail
          mkdir -p /tmp/artifact
          APK="$(find /tmp/appsrc/UreaClientApp/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" /tmp/artifact/UreaClientApp-v1.5.5-release-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 /tmp/artifact/UreaClientApp-v1.5.5-release-aligned-unsigned.apk
          cp /tmp/UreaClientApp-source-v1.5.5.zip /tmp/artifact/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/artifact/
          sha256sum /tmp/artifact/* > /tmp/artifact/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: UreaClientApp-v1.5.5-final-build
          path: /tmp/artifact/
          if-no-files-found: error
          retention-days: 3
