name: ChatGPT Android Build

on:
  push:
    branches:
      - chatgpt/app-v1.2.0-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK components
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recreate and verify APP source
        run: |
          set -euxo pipefail
          cat chatgpt-build/UreaClientApp-source-v1.2.0.zip.b64.* > /tmp/app.zip.b64
          base64 --decode /tmp/app.zip.b64 > /tmp/UreaClientApp-source-v1.2.0.zip
          echo "79ad1e4c913be18f5e41e838775f1c6e3ad7d4b0da764d21ff663f7a262d7566  /tmp/UreaClientApp-source-v1.2.0.zip" | sha256sum -c -
          mkdir -p /tmp/appsrc
          unzip -q /tmp/UreaClientApp-source-v1.2.0.zip -d /tmp/appsrc
          test -f /tmp/appsrc/UreaClientApp/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/appsrc/UreaClientApp/app/src/main/java/com/urea/selfservice/client/SalesBarChartView.java')
          s = p.read_text()
          old = '        setMinimumHeight(dp(190));'
          new = '        setMinimumHeight(Math.round(dp(190)));'
          if old not in s:
              raise SystemExit('expected SalesBarChartView source line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -F 'setMinimumHeight(Math.round(dp(190)));' /tmp/appsrc/UreaClientApp/app/src/main/java/com/urea/selfservice/client/SalesBarChartView.java

      - name: Build unsigned release APK
        working-directory: /tmp/appsrc/UreaClientApp
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Collect unsigned APK and Android signing tools
        run: |
          set -euxo pipefail
          mkdir -p /tmp/artifact
          APK="$(find /tmp/appsrc/UreaClientApp/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" /tmp/artifact/UreaClientApp-v1.2.0-release-unsigned.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          tar -C "$ANDROID_HOME/build-tools" -czf /tmp/artifact/android-build-tools-35.0.0.tar.gz 35.0.0
          sha256sum /tmp/artifact/UreaClientApp-v1.2.0-release-unsigned.apk /tmp/artifact/android-build-tools-35.0.0.tar.gz > /tmp/artifact/SHA256SUMS.txt
          ls -lh /tmp/artifact

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: UreaClientApp-v1.2.0-unsigned-build
          path: /tmp/artifact/
          if-no-files-found: error
          retention-days: 1
