name: ChatGPT Android Build V1.5.0

on:
  push:
    branches:
      - chatgpt/app-v1.5.0-ci

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK components
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recreate V1.4.0 and apply V1.5.0 overlay
        run: |
          set -euxo pipefail
          cat chatgpt-build/UreaClientApp-source-v1.2.0.zip.b64.* > /tmp/app.zip.b64
          base64 --decode /tmp/app.zip.b64 > /tmp/UreaClientApp-source-v1.2.0.zip
          echo "79ad1e4c913be18f5e41e838775f1c6e3ad7d4b0da764d21ff663f7a262d7566  /tmp/UreaClientApp-source-v1.2.0.zip" | sha256sum -c -
          mkdir -p /tmp/appsrc
          unzip -q /tmp/UreaClientApp-source-v1.2.0.zip -d /tmp/appsrc
          test -f /tmp/appsrc/UreaClientApp/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/appsrc/UreaClientApp/app/src/main/java/com/urea/selfservice/client/SalesBarChartView.java')
          s = p.read_text()
          s = s.replace('        setMinimumHeight(dp(190));', '        setMinimumHeight(Math.round(dp(190)));', 1)
          p.write_text(s)
          PY

          cat chatgpt-build/v130-overlay-small.b64.* > /tmp/v130-overlay.b64
          base64 --decode /tmp/v130-overlay.b64 > /tmp/v130-overlay.tar.gz
          echo "73ea9a9652114c251b8f65feeec27340039e7803c277696443b8efaf7221b2c0  /tmp/v130-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v130-overlay.tar.gz -C /tmp/appsrc/UreaClientApp

          cat chatgpt-build/v140-overlay2.b64.* > /tmp/v140-overlay.b64
          base64 --decode /tmp/v140-overlay.b64 > /tmp/v140-overlay.tar.gz
          echo "60b2b190362e3319b0f73690e96633be5356ca5acf706eec7243bb320023914f  /tmp/v140-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v140-overlay.tar.gz -C /tmp/appsrc/UreaClientApp

          cat chatgpt-build/v150-overlay.b64.* > /tmp/v150-overlay.b64
          base64 --decode /tmp/v150-overlay.b64 > /tmp/v150-overlay.tar.gz
          echo "260b48f90fad60aa491ccdf4ec5b4a2243dacfab1dee570d819013a43d09e37a  /tmp/v150-overlay.tar.gz" | sha256sum -c -
          tar -tzf /tmp/v150-overlay.tar.gz >/tmp/v150-files.txt
          test -s /tmp/v150-files.txt
          tar -xzf /tmp/v150-overlay.tar.gz -C /tmp/appsrc/UreaClientApp

          grep -F 'versionCode 6' /tmp/appsrc/UreaClientApp/app/build.gradle
          grep -F "versionName '1.5.0'" /tmp/appsrc/UreaClientApp/app/build.gradle
          grep -F 'RegisterActivity' /tmp/appsrc/UreaClientApp/app/src/main/AndroidManifest.xml
          grep -F 'exportOrdersCsv' /tmp/appsrc/UreaClientApp/app/src/main/java/com/urea/selfservice/client/ApiClient.java
          grep -F 'salesCustom' /tmp/appsrc/UreaClientApp/app/src/main/res/layout/activity_sales.xml
          grep -F 'basicInfoCard' /tmp/appsrc/UreaClientApp/app/src/main/res/layout/activity_my.xml
          grep -F 'FLAG_ACTIVITY_NO_ANIMATION' /tmp/appsrc/UreaClientApp/app/src/main/java/com/urea/selfservice/client/BottomNavHelper.java
          ! grep -q 'navOrders' /tmp/appsrc/UreaClientApp/app/src/main/res/layout/view_bottom_nav.xml

      - name: Build unsigned release APK
        working-directory: /tmp/appsrc/UreaClientApp
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Collect unsigned APK and Android signing tools
        run: |
          set -euxo pipefail
          mkdir -p /tmp/artifact
          APK="$(find /tmp/appsrc/UreaClientApp/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" /tmp/artifact/UreaClientApp-v1.5.0-release-unsigned.apk
          tar -C "$ANDROID_HOME/build-tools" -czf /tmp/artifact/android-build-tools-35.0.0.tar.gz 35.0.0
          sha256sum /tmp/artifact/UreaClientApp-v1.5.0-release-unsigned.apk /tmp/artifact/android-build-tools-35.0.0.tar.gz > /tmp/artifact/SHA256SUMS.txt
          ls -lh /tmp/artifact

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: UreaClientApp-v1.5.0-unsigned-build
          path: /tmp/artifact/
          if-no-files-found: error
          retention-days: 1
