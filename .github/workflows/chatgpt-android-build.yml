name: ChatGPT Android Build V1.5.2

on:
  push:
    branches:
      - chatgpt/app-v1.5.2-ci

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK components
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recreate V1.5.0 and apply V1.5.1 text overlay
        run: |
          set -euxo pipefail
          cat chatgpt-build/UreaClientApp-source-v1.2.0.zip.b64.* > /tmp/app.zip.b64
          base64 --decode /tmp/app.zip.b64 > /tmp/UreaClientApp-source-v1.2.0.zip
          echo "79ad1e4c913be18f5e41e838775f1c6e3ad7d4b0da764d21ff663f7a262d7566  /tmp/UreaClientApp-source-v1.2.0.zip" | sha256sum -c -
          mkdir -p /tmp/appsrc
          unzip -q /tmp/UreaClientApp-source-v1.2.0.zip -d /tmp/appsrc
          test -f /tmp/appsrc/UreaClientApp/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/appsrc/UreaClientApp/app/src/main/java/com/urea/selfservice/client/SalesBarChartView.java')
          s = p.read_text()
          s = s.replace('        setMinimumHeight(dp(190));', '        setMinimumHeight(Math.round(dp(190)));', 1)
          p.write_text(s)
          PY

          cat chatgpt-build/v130-overlay-small.b64.* > /tmp/v130-overlay.b64
          base64 --decode /tmp/v130-overlay.b64 > /tmp/v130-overlay.tar.gz
          echo "73ea9a9652114c251b8f65feeec27340039e7803c277696443b8efaf7221b2c0  /tmp/v130-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v130-overlay.tar.gz -C /tmp/appsrc/UreaClientApp

          cat chatgpt-build/v140-overlay2.b64.* > /tmp/v140-overlay.b64
          base64 --decode /tmp/v140-overlay.b64 > /tmp/v140-overlay.tar.gz
          echo "60b2b190362e3319b0f73690e96633be5356ca5acf706eec7243bb320023914f  /tmp/v140-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v140-overlay.tar.gz -C /tmp/appsrc/UreaClientApp

          cat chatgpt-build/v150-overlay.b64.* > /tmp/v150-overlay.b64
          base64 --decode /tmp/v150-overlay.b64 > /tmp/v150-overlay.tar.gz
          echo "260b48f90fad60aa491ccdf4ec5b4a2243dacfab1dee570d819013a43d09e37a  /tmp/v150-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v150-overlay.tar.gz -C /tmp/appsrc/UreaClientApp

          cp -a chatgpt-v151-overlay/. /tmp/appsrc/UreaClientApp/
          rm -f /tmp/appsrc/UreaClientApp/app/src/main/java/com/urea/selfservice/client/SettingsActivity.java
          rm -f /tmp/appsrc/UreaClientApp/app/src/main/res/layout/activity_settings.xml
          rm -f /tmp/appsrc/UreaClientApp/app/src/main/res/layout/dialog_connection_settings.xml

          python3 - <<'PY'
          from pathlib import Path

          main = Path('/tmp/appsrc/UreaClientApp/app/src/main/java/com/urea/selfservice/client/MainActivity.java')
          s = main.read_text()
          replacements = [
              ('需要配置高德 Android Key', '地图服务尚未配置'),
              ('APK 已使用固定包名和发布签名。请在高德开放平台创建 Android 平台 Key，并在设置中填写后即可显示真实地图。设备数据仍可正常读取。', '服务器尚未下发高德 Android Key。请联系平台管理员，在运营后台“设备分布 → 地图配置”中填写 Android SDK Key。设备列表和其他业务数据仍可正常使用。'),
              ('.setNegativeButton("稍后", null)\n', ''),
              ('.setPositiveButton("去设置", (d,w) -> startActivity(new Intent(this, MyActivity.class)))', '.setPositiveButton("知道了", null)'),
              ('请先在设置中填写高德 Android Key', '服务器尚未配置高德 Android Key，请联系平台管理员'),
          ]
          for old, new in replacements:
              assert old in s, f'MainActivity baseline token not found: {old[:30]}'
              s = s.replace(old, new, 1)
          main.write_text(s)

          my = Path('/tmp/appsrc/UreaClientApp/app/src/main/res/layout/activity_my.xml')
          x = my.read_text()
          replacements = [
              ('android:text="连接设置" android:textColor="@color/text_primary"', 'android:text="应用与连接" android:textColor="@color/text_primary"'),
              ('android:text="服务器与地图服务" android:textColor="@color/text_secondary"', 'android:text="服务器与地图服务 · 自动配置" android:textColor="@color/text_secondary"'),
              ('<TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="20dp" android:gravity="center" android:text="版本 1.5.0" android:textColor="@color/text_secondary" android:textSize="12sp"/>', '<TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="20dp" android:gravity="center" android:id="@+id/appVersionText" android:text="版本 1.5.1" android:textColor="@color/text_secondary" android:textSize="12sp"/>'),
          ]
          for old, new in replacements:
              assert old in x, f'activity_my baseline token not found: {old[:40]}'
              x = x.replace(old, new, 1)
          my.write_text(x)
          PY

          cd /tmp/appsrc/UreaClientApp
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in [Path('app/src/main/AndroidManifest.xml'), Path('app/src/main/res/layout/activity_login.xml'), Path('app/src/main/res/layout/activity_my.xml'), Path('app/src/main/res/layout/activity_register.xml')]:
              ET.parse(p)
          PY
          grep -F 'versionCode 7' app/build.gradle
          grep -F "versionName '1.5.1'" app/build.gradle
          grep -F 'android:scheme="ureaclient"' app/src/main/AndroidManifest.xml
          grep -F 'class BootstrapManager' app/src/main/java/com/urea/selfservice/client/BootstrapManager.java
          grep -F '/api/app/bootstrap' app/src/main/java/com/urea/selfservice/client/BootstrapManager.java
          grep -F 'serverStatusText' app/src/main/res/layout/activity_login.xml
          grep -F 'registerServerStatus' app/src/main/res/layout/activity_register.xml
          grep -F 'appVersionText' app/src/main/res/layout/activity_my.xml
          grep -F '服务器尚未配置高德 Android Key' app/src/main/java/com/urea/selfservice/client/MainActivity.java
          test ! -e app/src/main/java/com/urea/selfservice/client/SettingsActivity.java
          test ! -e app/src/main/res/layout/activity_settings.xml
          test ! -e app/src/main/res/layout/dialog_connection_settings.xml

      - name: Apply V1.5.2 home sales dashboard overlay
        run: |
          set -euxo pipefail
          cat chatgpt-build/v152-overlay.b64.* > /tmp/v152-overlay.b64
          base64 --decode /tmp/v152-overlay.b64 > /tmp/v152-overlay.tar.gz
          echo "2326eff6683be6f466816707fc21cc87bfcfc717d541a04d3a2cad5302b1dd53  /tmp/v152-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v152-overlay.tar.gz -C /tmp/appsrc/UreaClientApp
          cd /tmp/appsrc/UreaClientApp
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('app/src/main/res').rglob('*.xml'):
              ET.parse(p)
          ET.parse('app/src/main/AndroidManifest.xml')
          PY
          grep -F 'versionCode 8' app/build.gradle
          grep -F "versionName '1.5.2'" app/build.gradle
          grep -F '/api/app/bootstrap' app/src/main/java/com/urea/selfservice/client/BootstrapManager.java
          grep -F 'class SalesBarChartView' app/src/main/java/com/urea/selfservice/client/SalesBarChartView.java
          grep -F 'homeChipToday' app/src/main/res/layout/activity_home.xml
          grep -F 'homeChipYesterday' app/src/main/res/layout/activity_home.xml
          grep -F 'homeChip7' app/src/main/res/layout/activity_home.xml
          grep -F 'homeChip30' app/src/main/res/layout/activity_home.xml
          grep -F 'homeChipCustom' app/src/main/res/layout/activity_home.xml
          grep -F 'getSalesRange' app/src/main/java/com/urea/selfservice/client/ApiClient.java
          grep -F '服务器与地图服务 · 自动配置' app/src/main/res/layout/activity_my.xml
          test ! -e app/src/main/java/com/urea/selfservice/client/SettingsActivity.java

      - name: Package V1.5.2 source
        run: |
          set -euxo pipefail
          cd /tmp/appsrc
          zip -qr /tmp/UreaClientApp-source-v1.5.2.zip UreaClientApp
          sha256sum /tmp/UreaClientApp-source-v1.5.2.zip

      - name: Build unsigned release APK
        working-directory: /tmp/appsrc/UreaClientApp
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Align and collect V1.5.2 artifacts
        run: |
          set -euxo pipefail
          mkdir -p /tmp/artifact
          APK="$(find /tmp/appsrc/UreaClientApp/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" /tmp/artifact/UreaClientApp-v1.5.2-release-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 /tmp/artifact/UreaClientApp-v1.5.2-release-aligned-unsigned.apk | tail -5
          cp /tmp/UreaClientApp-source-v1.5.2.zip /tmp/artifact/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/artifact/
          sha256sum /tmp/artifact/* > /tmp/artifact/SHA256SUMS.txt
          ls -lh /tmp/artifact

      - name: Upload V1.5.2 build
        uses: actions/upload-artifact@v4
        with:
          name: UreaClientApp-v1.5.2-build
          path: /tmp/artifact/
          if-no-files-found: error
          retention-days: 3
